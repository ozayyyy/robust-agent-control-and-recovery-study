[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "racrs"
version = "0.1.0"
description = "Study of how tool-using AI agents behave when their plans are interrupted by unreliable tools, changing state, partial failures, conflicting observations or unexpected side effects."
keywords = ["ai-agents", "agent-safety", "fault-injection", "recovery", "tool-use", "evaluation"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[project.scripts]
racrs = "racrs.cli:main"

[tool.setuptools.packages.find]
include = ["racrs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
